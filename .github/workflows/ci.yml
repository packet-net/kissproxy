name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build
        run: dotnet build src/kissproxy.sln -c Release
      - name: Test
        run: dotnet test src/kissproxy.sln -c Release --no-build
